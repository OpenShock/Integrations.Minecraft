# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# 1.21.x targets need a Java 21 toolchain, 26.x targets need Java 25. Locally Gradle finds both by
# auto-detection, but on CI actions/setup-java installs into a tool cache Gradle does not scan, so
# point it at the JAVA_HOME_* variables that action exports. Missing entries are ignored, which
# makes this a no-op on a normal dev machine.
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64,JAVA_HOME_17_ARM64,JAVA_HOME_21_ARM64,JAVA_HOME_25_ARM64

# Mod Properties
mod.id=shockcraft
mod.name=ShockCraft
mod.version=1.3.1
mod.group=openshock.integrations.minecraft
mod.description=OpenShock integration for Minecraft
